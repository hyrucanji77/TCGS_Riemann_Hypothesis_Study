name: Build manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - 'main.tex'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuscript-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the manuscript
        uses: actions/checkout@v4
      - name: Check source availability
        id: source
        shell: bash
        run: |
          if test -f main.tex; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Manuscript upload is not complete yet; no PDF is built.'
          fi
      - name: Install the LaTeX build tools
        if: steps.source.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern
      - name: Compile the unchanged manuscript
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build main.tex
          if grep -Eq 'There were undefined references|Citation .* undefined|Reference .* undefined' build/main.log; then
            echo 'Unresolved references found in the manuscript build.' >&2
            exit 1
          fi
          cp build/main.pdf main.pdf
          mkdir -p verification
          sha256sum main.tex main.pdf > verification/github_build_sha256.txt
          pdflatex --version > verification/github_tex_version.txt
      - name: Commit the compiled paper
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.pdf verification/github_build_sha256.txt verification/github_tex_version.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Build PDF from the final submission LaTeX source'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
