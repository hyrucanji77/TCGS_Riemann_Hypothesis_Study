name: Build manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - 'main.tex'
      - '.upload_source/ready.json'
      - '.github/workflows/build-paper.yml'
      - '*.py'
      - 'requirements.txt'
      - 'release_integrity_20260930.json'
      - 'tools/publish_review.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuscript-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the current manuscript and its history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Import the exact reviewed source
        run: python3 tools/publish_review.py import-source
      - name: Install the LaTeX build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Compile the unchanged reviewed manuscript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build verification
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build main.tex
          if grep -Eq 'There were undefined references|Citation .* undefined|Reference .* undefined' build/main.log; then
            echo 'Unresolved manuscript references.' >&2
            exit 1
          fi
          cp build/main.pdf main.pdf
          cp build/main.pdf riemann_hypothesis_TCGS_SEQUENTION.pdf
          sha256sum main.tex main.pdf riemann_hypothesis_TCGS_SEQUENTION.pdf > verification/github_build_sha256.txt
          pdflatex --version > verification/github_tex_version.txt
          pdfinfo main.pdf > verification/github_pdf_info.txt
          pdftotext -layout main.pdf verification/github_paper_text.txt
      - name: Install the reference Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Verify the approved scientific files
        run: |
          python -m pip install -r requirements.txt
          python tools/publish_review.py verify-inputs
      - name: Reproduce the nine legacy diagnostics
        run: |
          python verify_release.py --output-dir verification/fresh_run_ci --jobs 2 --timeout 600
          cp verification/fresh_run_ci/report.json verification/github_diagnostics_report.json
      - name: Reproduce Appendix E separately
        run: |
          python verify_screw_release.py --output-dir verification/fresh_screw_ci --timeout 600
          cp verification/fresh_screw_ci/report.json verification/github_screw_diagnostics_report.json
      - name: Package the verified paper and code
        run: python tools/publish_review.py package
      - name: Retain build and verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: riemann-review-amended-paper-and-verification
          path: |
            main.pdf
            main.tex
            riemann_hypothesis_TCGS_SEQUENTION.pdf
            TCGS_Riemann_Hypothesis_Study_Overleaf.zip
            verification/github_*
            build/main.log
          if-no-files-found: error
          retention-days: 30
      - name: Commit the compiled paper and verified bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.tex main.pdf riemann_hypothesis_TCGS_SEQUENTION.pdf source_manifest.json TCGS_Riemann_Hypothesis_Study_Overleaf.zip screw_kernel_40.json screw_kernel_60.json verification/github_*
          if test -f .upload_source/ready.json; then
            git rm -r .upload_source
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 30 September review-amended manuscript and verified Appendix E bundle'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
