name: Package verified paper release

on:
  push:
    branches: [main]
    paths:
      - 'CITATION.cff'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/package-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuscript-pdf
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the latest completed build
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check whether the source import is complete
        id: ready
        shell: bash
        run: |
          if test -f main.tex && ! test -f .upload_source/ready.json; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo 'The manuscript build will publish the complete verified bundle.'
          fi
      - name: Verify both diagnostic reports and refresh the download bundle
        if: steps.ready.outputs.complete == 'true'
        run: python3 tools/publish_review.py package
      - name: Commit the refreshed metadata and bundle
        if: steps.ready.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source_manifest.json TCGS_Riemann_Hypothesis_Study_Overleaf.zip verification/github_package_record.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh the reviewed paper bundle and citation metadata'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
